<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d995d3"><title>Mi Entrenadora ♡</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#4d2b4c;background:#fff6fd}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(130deg,#f7c9e8,#d9c5ff);padding:23px 19px 27px;border-radius:0 0 28px 28px}h1{font-size:27px;margin:0}h2{font-size:23px}h3{margin:4px 0 8px}main{max-width:660px;margin:auto;padding:16px 16px 90px}.card{background:#fff;border:1px solid #efd7ed;border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 6px 20px #b07da31a}.hero{background:linear-gradient(120deg,#ffe7f4,#eee2ff)}.muted{color:#836b84;font-size:14px}.pill{display:inline-block;background:#f6e5fa;border-radius:22px;padding:7px 11px;font-size:13px;margin:3px}.btn,button{border:0;background:#ac68b9;color:white;border-radius:15px;padding:13px 15px;font-weight:700;font-size:14px;cursor:pointer}.secondary{background:#f3e4f6;color:#6d3f78}.outline{background:white;color:#84468e;border:1px solid #e6c5e7}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.buttons button{flex:1}button:disabled{opacity:.4}video{width:100%;aspect-ratio:400/260;border-radius:16px;background:#f9eafa;display:block}nav{position:fixed;bottom:0;left:0;right:0;background:#fffdfefa;border-top:1px solid #efd7ed;display:flex;justify-content:center;z-index:5;padding:9px 5px env(safe-area-inset-bottom)}nav button{background:none;color:#79557f;font-size:12px;padding:9px 12px}nav button.active{background:#f6e4fa;color:#a04da6}.bar{height:9px;background:#f2dff2;border-radius:9px;overflow:hidden}.bar div{height:100%;background:#c27ac8;transition:width .3s}textarea{width:100%;min-height:90px;border:1px solid #e3c9e5;border-radius:12px;padding:10px;font:inherit}label{display:block;margin:12px 0 5px;font-weight:600}.warning{background:#fff2f5;border-left:4px solid #cf83a4;padding:12px;border-radius:10px;font-size:13px} .timer{font-size:42px;font-weight:750;text-align:center;margin:10px}.small{font-size:13px} .videohead{display:flex;align-items:center;justify-content:space-between;gap:8px}.hidden{display:none}
</style></head><body><header><h1>♡ Mi Entrenadora</h1><div>Tu espacio rosa y lila · fuerza, postura y bienestar</div></header><main id="app"></main><nav><button id="navhome" onclick="home()">⌂ Inicio</button><button id="navvideos" onclick="library()">▶ Vídeos</button><button id="navprogress" onclick="progress()">♡ Progreso</button></nav><script>
const E=[
{name:'Respiración y postura',duration:90,sets:'90 segundos',gear:'Esterilla',how:'Túmbate boca arriba con las rodillas flexionadas. Deja descansar la cabeza y afloja la mandíbula.',breath:'Inspira suave por la nariz; expira sin forzar.',neck:'No empujes la nuca contra la esterilla.'},
{name:'Movilidad torácica',duration:120,sets:'6 por lado',gear:'Esterilla',how:'Túmbate de lado con rodillas flexionadas. Abre el brazo superior girando suavemente el tronco. Cambia de lado a mitad.',breath:'Expira al abrir e inspira al regresar.',neck:'No fuerces el giro de la cabeza.'},
{name:'Remo con banda',duration:150,sets:'2 × 10',gear:'Banda suave',how:'Sentada, coloca la banda alrededor de los pies. Lleva los codos hacia atrás y vuelve despacio.',breath:'Expira al tirar e inspira al volver.',neck:'Afloja la banda si aprietas la nuca; mantén la mandíbula relajada.'},
{name:'Rotación externa de hombro',duration:120,sets:'2 × 8 por lado',gear:'Banda muy suave',how:'Con el codo pegado al costado y flexionado, gira el antebrazo hacia fuera sin mover el tronco.',breath:'Expira al abrir e inspira al regresar.',neck:'Cabeza alineada y hombros sin elevarse.'},
{name:'Dead bug adaptado',duration:120,sets:'2 × 6 por lado',gear:'Esterilla',how:'Boca arriba, con la cabeza apoyada, baja un talón hacia el suelo y regresa alternando piernas.',breath:'Expira al bajar el talón e inspira al volver.',neck:'Reduce el recorrido si arqueas la espalda. No levantes la cabeza.'},
{name:'Relajación final',duration:90,sets:'90 segundos',gear:'Esterilla',how:'Siéntate o túmbate cómoda. Afloja hombros y mandíbula; observa cómo se encuentra la nuca.',breath:'Inspira con suavidad y expira lentamente.',neck:'Evita estiramientos intensos del cuello.'},
{name:'Sentadilla a silla',duration:150,sets:'2 × 10',gear:'Silla estable',how:'Pies a la anchura de las caderas. Lleva la cadera atrás, toca la silla y levántate con control.',breath:'Inspira al bajar y expira al levantarte.',neck:'Mantén la mirada natural, sin sacar la barbilla.'},
{name:'Puente de glúteos',duration:150,sets:'2 × 12',gear:'Esterilla',how:'Boca arriba, rodillas flexionadas y pies apoyados. Eleva la pelvis sin arquear la espalda.',breath:'Expira al subir e inspira al bajar.',neck:'Deja la cabeza apoyada, sin empujarla contra el suelo.'},
{name:'Flexión en pared',duration:120,sets:'2 × 8',gear:'Pared',how:'Manos a la altura del pecho; acerca el cuerpo a la pared flexionando los codos y empuja para volver.',breath:'Inspira al acercarte y expira al empujar.',neck:'No adelantes la cabeza ni aprietes la mandíbula.'}
];
const W=[{name:'Espalda y postura',minutes:15,desc:'Movilidad, fuerza ligera y cuidado cervical',ids:[0,1,2,3,7,4,5],durations:[90,120,150,120,120,120,180]},{name:'Fuerza completa',minutes:25,desc:'Piernas, glúteos, espalda y abdomen',ids:[0,6,7,2,8,4,5],durations:[180,240,240,240,240,210,150]},{name:'Exprés',minutes:10,desc:'Para días con poco tiempo',ids:[0,6,7,2,5],durations:[90,150,150,120,90]}];
let page='home',wi=0,si=0,remaining=0,running=false,interval=null,voice=true,sessionStarted=false;const app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function stop(){clearInterval(interval);interval=null;running=false;if('speechSynthesis'in window)speechSynthesis.cancel()}function say(t){if(!voice||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.87;u.pitch=1.08;speechSynthesis.speak(u)}function video(id,autoplay=false){return `<video playsinline loop muted ${autoplay?'autoplay':''} controls preload="metadata" poster="" src="videos/${id}.mp4">Tu navegador no puede reproducir este vídeo.</video>`}function nav(active){for(let p of ['home','videos','progress'])document.getElementById('nav'+p).classList.toggle('active',active===p)}function show(html,active='home'){app.innerHTML=html;nav(active);window.scrollTo(0,0)}function home(){stop();page='home';show(`<h2>¿Qué entrenamos hoy? 💗</h2><p class="muted">Elige según tu tiempo y energía. Tu nuca siempre es prioridad.</p><section class="card hero"><h3>🎀 Dos maneras de entrenar</h3><p>▶ Clase automática con vídeos y voz · 🎬 Demostraciones individuales en bucle.</p><button onclick="library()">Ver vídeos por ejercicio</button></section>`+W.map((w,i)=>`<section class="card"><h3>${esc(w.name)}</h3><p>${esc(w.desc)}</p><span class="pill">⏱ ${w.minutes} min</span><span class="pill">🎥 Vídeos + voz</span><div class="buttons"><button onclick="openWorkout(${i})">Ver rutina</button><button class="secondary" onclick="begin(${i})">▶ Empezar clase</button></div></section>`).join('')+`<p class="warning">Por tu intervención cervical y antecedentes de mareos, empieza con resistencia baja. Detente si aparecen mareos, dolor creciente, hormigueos o dolor de cabeza nuevo. Si la nuca se carga, reduce la resistencia o cambia de ejercicio.</p>`)}
function openWorkout(i){stop();wi=i;page='workout';let w=W[i];show(`<button class="secondary" onclick="home()">← Volver</button><h2>${w.name}</h2><p>${w.desc}</p><div class="card"><h3>Tu clase de ${w.minutes} minutos</h3><p class="muted">Vídeos ilustrativos animados, guía hablada por el dispositivo y cambios automáticos de ejercicio.</p><button onclick="begin(${i})">▶ Iniciar clase guiada</button></div>`+w.ids.map((id,j)=>`<section class="card"><div class="videohead"><strong>${j+1}. ${E[id].name}</strong><span class="pill">${E[id].sets}</span></div>${video(id)}<p class="small">🌬 ${E[id].breath}</p><button class="secondary" onclick="detail(${id})">Técnica y voz</button></section>`).join(''))}
function library(){stop();page='videos';show(`<h2>🎬 Vídeos por ejercicio</h2><p class="muted">Demostraciones animadas en bucle. Son esquemas de movimiento, no vídeos de una entrenadora real ni una evaluación de tu postura.</p>`+E.map((e,id)=>`<section class="card"><h3>${e.name}</h3>${video(id)}<p class="muted">${e.sets} · ${e.gear}</p><button onclick="detail(${id})">Ver técnica y escuchar guía</button></section>`).join(''),'videos')}
function detail(id){stop();page='detail';let e=E[id];show(`<button class="secondary" onclick="library()">← Vídeos</button><h2>${e.name}</h2><div class="card">${video(id,true)}<span class="pill">${e.sets}</span><span class="pill">${e.gear}</span><h3>Cómo hacerlo</h3><p>${e.how}</p><h3>🌬 Respiración</h3><p>${e.breath}</p><h3>💜 Cuida tu nuca</h3><p>${e.neck}</p><button onclick="say(E[${id}].name+'. '+E[${id}].how+' Respiración: '+E[${id}].breath+' Cuida tu nuca: '+E[${id}].neck)">🔊 Escuchar instrucciones</button><button class="secondary" onclick="speechSynthesis.cancel()">Silenciar</button></div>`,'videos')}
function begin(i){stop();wi=i;si=0;remaining=W[i].durations[0];sessionStarted=true;page='class';drawClass();say('Empezamos la clase de '+W[i].name+'. '+cue())}function cue(){let e=E[W[wi].ids[si]];return e.name+'. '+e.how+' '+e.breath+' '+e.neck+' Haz el movimiento despacio y descansa cuando lo necesites.'}function fmt(n){return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}function drawClass(){let w=W[wi],id=w.ids[si],e=E[id],passed=w.durations.slice(0,si).reduce((a,b)=>a+b,0)+w.durations[si]-remaining,total=w.durations.reduce((a,b)=>a+b,0);show(`<button class="secondary" onclick="leaveClass()">← Salir de clase</button><h2>${w.name}</h2><p class="muted">Ejercicio ${si+1} de ${w.ids.length} · ${e.name}</p><div class="bar"><div style="width:${passed/total*100}%"></div></div><section class="card">${video(id,true)}<div class="timer" id="clock">${fmt(remaining)}</div><p class="muted" style="text-align:center">Tiempo restante de este ejercicio</p><h3>${e.name}</h3><p>${e.how}</p><p><b>🌬 Respiración:</b> ${e.breath}</p><p><b>💜 Nuca:</b> ${e.neck}</p><div class="buttons"><button id="playbtn" onclick="toggleTimer()">${running?'⏸ Pausar':'▶ Continuar'}</button><button class="secondary" onclick="say(cue())">🔊 Repetir guía</button><button class="secondary" onclick="voice=!voice;drawClass()">Voz: ${voice?'sí':'no'}</button></div></section><div class="buttons"><button class="outline" ${si===0?'disabled':''} onclick="move(-1)">← Anterior</button><button onclick="move(1)">${si===w.ids.length-1?'Finalizar ✓':'Siguiente →'}</button></div><p class="muted small">Los vídeos se repiten mientras dura cada ejercicio. Los tiempos incluyen pausas breves: puedes detener el contador para descansar más.</p>`);if(running)startTicker()}
function toggleTimer(){if(running){clearInterval(interval);running=false;document.getElementById('playbtn').textContent='▶ Continuar';speechSynthesis.cancel()}else{running=true;document.getElementById('playbtn').textContent='⏸ Pausar';say(cue());startTicker()}}
function startTicker(){clearInterval(interval);interval=setInterval(()=>{if(!running)return;remaining--;let c=document.getElementById('clock');if(c)c.textContent=fmt(Math.max(remaining,0));if(remaining===15)say('Quedan quince segundos. Respira y mantén la nuca relajada.');if(remaining<=0)move(1)},1000)}function move(delta){clearInterval(interval);speechSynthesis.cancel();if(si+delta>=W[wi].ids.length){finish();return}si=Math.max(0,si+delta);remaining=W[wi].durations[si];let wasRunning=running;running=wasRunning;drawClass();if(voice)say('Siguiente ejercicio. '+cue())}function leaveClass(){stop();openWorkout(wi)}function finish(){stop();let a=JSON.parse(localStorage.getItem('me_sessions')||'[]');a.push({date:new Date().toISOString(),workout:W[wi].name});localStorage.setItem('me_sessions',JSON.stringify(a));page='finished';show(`<section class="card hero"><h2>¡Clase terminada! 💗</h2><p>Has completado ${W[wi].name}. ¿Cómo está tu nuca? Descansa y anota tus sensaciones.</p><button onclick="progress()">Ir a mi progreso</button><button class="secondary" onclick="home()">Inicio</button></section>`)}function progress(){stop();page='progress';let a=JSON.parse(localStorage.getItem('me_sessions')||'[]');show(`<h2>♡ Mi progreso</h2><section class="card"><h3>${a.length} sesiones completadas</h3><p class="muted">Se guardan solo en este navegador.</p>${a.slice(-10).reverse().map(x=>`<p>✓ ${esc(x.workout)} · ${new Date(x.date).toLocaleDateString('es-ES')}</p>`).join('')||'<p>Aún no hay sesiones registradas.</p>'}</section><section class="card"><h3>Mi diario cervical</h3><label for="notes">¿Qué ejercicios te resultaron cómodos?</label><textarea id="notes">${esc(localStorage.getItem('me_notes')||'')}</textarea><div class="buttons"><button onclick="localStorage.setItem('me_notes',document.getElementById('notes').value);alert('Notas guardadas')">Guardar notas</button></div></section>`,'progress')}
window.addEventListener('pagehide',()=>{clearInterval(interval);if('speechSynthesis'in window)speechSynthesis.cancel()});home();
</script></body></html>
